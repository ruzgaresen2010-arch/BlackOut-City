  return new Promise((resolve)=>{
    if(window.supabase){resolve(true);return}
    const urls=[
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
      'https://unpkg.com/@supabase/supabase-js@2'
    ];
    let i=0;
    const next=()=>{
      if(window.supabase){resolve(true);return}
      if(i>=urls.length){resolve(false);return}
      const sc=document.createElement('script');
      sc.src=urls[i++];
      sc.onload=()=>resolve(!!window.supabase);
      sc.onerror=next;
      document.head.appendChild(sc);
    };
    next();
  });
};

const gA=()=>(S.inv.knife?15:0)+(S.inv.gun?45:0),gD=()=>S.inv.vest?40:0,atk=()=>S.str*2+S.spd+gA(),dfn=()=>S.def*2+S.spd+gD();
const log=(t,c)=>{S.log.unshift({t,c:c||''});S.log=S.log.slice(0,30)};
function gain(x){S.exp+=x;while(S.exp>=S.lvl*100){S.exp-=S.lvl*100;S.lvl++;log('Level up! You are now level '+S.lvl,'g')}}
function hurt(d){S.life-=d;if(S.life<=0){S.life=1;const l=Math.floor(S.money*.1);S.money-=l;S.hosp=Date.now()+45000;log('You collapsed. 45 seconds in hospital, '+fmt(l)+' in bills.','r')}}
function ok(e,n){if(busy()){log('You are in the hospital.','r');return 0}if(e&&S.energy<e){log('Not enough energy.','r');return 0}if(n&&S.nerve<n){log('Not enough nerve.','r');return 0}return 1}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function dailyReady(){if(!S.daily)S.daily={day:'',done:false};const d=todayKey();if(S.daily.day!==d){S.daily.day=d;S.daily.done=false;save()}return !S.daily.done}
const A={
  city(i){if(!dailyReady())return log('Today’s city activity is already complete. Come back tomorrow.','r');const acts=[{n:'Cafe shift',money:[90,160],x:8,h:5,e:8,msg:'You helped at a busy cafe.'},{n:'Park cleanup',money:[70,130],x:7,h:8,e:6,msg:'You cleaned up the park and earned a community bonus.'},{n:'Coding sprint',money:[110,210],x:12,h:2,e:10,msg:'You finished a small coding challenge.'}];const a=acts[i];if(S.energy<a.e)return log('Not enough energy.','r');S.energy-=a.e;S.happy=Math.min(100,S.happy+a.h);const m=rnd(...a.money);S.money+=m;gain(a.x);S.daily.done=true;log(a.msg+' +'+fmt(m),'g')},
crime(i){const c=CR[i];if(!ok(0,c.c))return;S.nerve-=c.c;S.c.crime++;if(Math.random()<Math.min(.95,c.p+S.dex*.005+S.lvl*.005)){const m=rnd(...c.r);S.money+=m;gain(c.x);log(c.n+' succeeded: '+fmt(m),'g')}else{const d=rnd(4,c.d);log(c.n+' failed! You lost '+d+' life.','r');hurt(d)}},
train(k){if(!ok(5))return;S.energy-=5;S.c.train++;const g=Math.max(1,Math.round(rnd(1,3)*(.5+S.happy/100)));S[k]+=g;S.happy=Math.max(0,S.happy-rnd(0,2));log('Trained '+k+': +'+g,'g')},
work(){const j=JB[S.job];if(!ok(10))return;S.energy-=10;S.c.work++;const m=rnd(...j.pay);S.money+=m;gain(3);log('Worked as '+j.n+': '+fmt(m),'g')},
job(i){S.job=i;log('New job: '+JB[i].n,'g')},
fight(i){const n=NP[i];if(!ok(10))return;S.energy-=10;const me=atk()+dfn()*.5+rnd(0,20),he=n.pw+rnd(0,20);if(me>he){const m=rnd(...n.r);S.money+=m;S.c.win++;gain(15+i*10);hurt(rnd(2,8));log('You beat '+n.n+': '+fmt(m),'g')}else{const d=Math.max(5,Math.round((he-me)/2)+rnd(5,15));log(n.n+' beat you up: -'+d+' life','r');hurt(d)}},
buy(id){const it=IT.find(x=>x.id===id);if(S.money<it.p)return log('Not enough cash.','r');if(it.t==='gear'&&S.inv[id])return log('You already own it.','r');S.money-=it.p;S.inv[id]=(S.inv[id]||0)+1;log('Bought '+it.n)},
use(id){if(!S.inv[id])return;S.inv[id]--;if(id==='en')S.energy=Math.min(maxL(),S.energy+25);if(id==='hp')S.life=Math.min(maxL(),S.life+50);if(id==='pill')S.nerve=Math.min(20+S.lvl,S.nerve+5);log('Used '+IT.find(x=>x.id===id).n,'g')},
bank(d){const v=Math.floor(+$('amt').value);if(!(v>0))return;if(d==='in'){if(v>S.money)return log('Not enough cash.','r');S.money-=v;S.bank+=v}else{if(v>S.bank)return log('Not enough in account.','r');S.bank-=v;S.money+=v}log((d==='in'?'Deposited ':'Withdrew ')+fmt(v))},
claim(id){const m=MS.find(x=>x.id===id);S.done[id]=1;S.money+=m.r;gain(20);log('Mission complete: '+m.n+' (+'+fmt(m.r)+')','g')},
async list(id){const p=Math.floor(+$('sp_'+id).value);if(!(p>0)||!S.inv[id])return log('Enter a price.','r');if(!db)return log('Player trading is disabled in local account mode.','r');S.inv[id]--;try{await db.doc('listings/'+uid+'_'+Date.now()).set({seller:uid,sn:S.name,item:id,price:p});log('Listed '+IT.find(x=>x.id===id).n+' for '+fmt(p),'g')}catch(e){S.inv[id]++;log('Listing failed (write access needed).','r')}},

prof(){S.motto=$('pm').value.slice(0,80);log('Profile saved.','g')},rename(){changeUsername()},
nopic(){S.pic=''},col(c){S.col=c},hat(h){S.hat=+h},reset(){if(confirm('Delete all progress?')){const t=JSON.parse(JSON.stringify(D));Object.keys(S).forEach(k=>{if(k!=='tab'&&k!=='log')S[k]=t[k]})}}};

function upl(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const q=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-q)/2,(im.height-q)/2,q,q,0,0,96,96);S.pic=c.toDataURL('image/jpeg',.7);log('Photo updated.','g');save();render()};im.src=r.result};r.readAsDataURL(f)}

function fmtTime(sec){sec=Math.max(0,Math.ceil(sec));if(sec<60)return sec+'s';const m=Math.floor(sec/60),s=sec%60;return m+'m '+String(s).padStart(2,'0')+'s'}
const REGEN={energy:5,nerve:10,happy:5,life:10};
function statData(key,v,m){const pct=Math.max(0,Math.min(100,v/m*100));const full=v>=m;const rate=REGEN[key]||0;return {pct,full,remaining:full||!rate?0:Math.ceil((m-v)*rate)}}
function statCard(key,n,v,m,c){const d=statData(key,v,m);return `<div class="stat-mini"><div class="stat-head"><span class="stat-name">${n}</span><span class="stat-value">${Math.floor(v)} / ${Math.floor(m)}</span></div><div class="stat-track"><div class="stat-fill" style="width:${d.pct}%;background:${c};color:${c}"></div></div><div class="stat-meta"><span>${Math.floor(d.pct)}%</span><span class="stat-next">${d.full?'FULL':'Full in '+fmtTime(d.remaining)}</span></div></div>`}
function bar(n,v,m,c){return statCard(n.toLowerCase(),n,v,m,c)}
function hudCard(label,value,sub,glow){return `<div class="hud-card" style="--glow:${glow}"><div class="hud-label">${label}</div><div class="hud-number">${value}</div><div class="hud-sub">${sub}</div></div>`}

  $('me').innerHTML=`<div class="row" style="border:0">${av(S.col,S.hat,52,S.pic)}<div class="g"><b>${esc(S.name)}</b><br><span class="mu">Level ${S.lvl}</span></div></div>`;
  $('bars').innerHTML='<div class="section-title"><div><div class="eyebrow">LIVE STATUS</div><h3>Resources</h3></div></div>'+statCard('energy','Energy',S.energy,maxL(),'var(--gd)')+statCard('nerve','Nerve',S.nerve,20+S.lvl,'var(--rd)')+statCard('happy','Happy',S.happy,100,'var(--ac)')+statCard('life','Life',S.life,maxL(),'var(--bl)')+statCard('xp','XP',S.exp,S.lvl*100,'var(--pu)');
  $('nav').innerHTML=TB.map(([k,n,i])=>`<button class="${S.tab===k?'on':''}" onclick='S.tab="${k}";$("main").className="";render();void $("main").offsetWidth;$("main").className="in"'>${ic(i)}${n}</button>`).join('')+(isAdmin?`<button class="${S.tab==='admin'?'on':''}" onclick='S.tab="admin";render()'>${ic('people')}Admin</button>`:'');
  $('warn').innerHTML=busy()?`<div class="warn">You are in the hospital. Discharged in ${Math.ceil((S.hosp-Date.now())/1000)}s.</div>`:'';
  if(!f){
    if(S.tab==='admin'&&!isAdmin)S.tab='home';
    const view=V[S.tab]||V.home;
    const hud='<div class="hud-grid">'+hudCard('Cash',fmt(S.money),'Available now','rgba(245,200,75,.14)')+hudCard('Bank',fmt(S.bank),'Stored funds','rgba(88,166,255,.13)')+hudCard('Level','Lv '+S.lvl,(S.lvl*100-S.exp)+' XP to next','rgba(169,139,255,.14)')+hudCard('Power',atk()+' / '+dfn(),'Attack / Defense','rgba(69,211,154,.12)')+'</div>';
    $('main').innerHTML=hud+`<div class="card hero">${scene(S.tab==='admin'?'people':S.tab)}</div>`+view();
  }
  $('log').innerHTML=S.log.map(l=>`<p class="log-line ${l.c}">${esc(l.t)}</p>`).join('')||'<p class="mu">Nothing yet.</p>';
}

async function loadP(){if(!supabase||!CLOUD_READY){C=[];DB_STATUS='Cloud unavailable';render();return}try{const field=SK==='money'?'net_worth':SK==='win'?'fight_wins':'level';const {data,error}=await supabase.from('leaderboard').select('username,display_name,level,net_worth,fight_wins,color,hat,motto').order(field,{ascending:false}).limit(100);if(error)throw error;C=(data||[]).map(p=>({name:p.display_name||p.username,lvl:p.level||1,money:0,bank:0,net_worth:Number(p.net_worth)||0,col:p.color||COL[0],hat:p.hat||0,motto:p.motto||'',c:{win:p.fight_wins||0},reg:1,username:p.username}));render()}catch(e){console.error('Leaderboard load failed',e);DB_STATUS='Leaderboard unavailable'}}

setInterval(()=>{if(G==='ok'){S.energy=Math.min(maxL(),S.energy+2);S.nerve=Math.min(20+S.lvl,S.nerve+1);S.happy=Math.min(100,S.happy+2);if(!busy())S.life=Math.min(maxL(),S.life+3);save();render()}},10000);
setInterval(()=>{if(G==='ok'){const i=Math.floor(S.bank*.005);if(i>0)S.bank+=i}},30000);
setInterval(()=>{if(G==='ok')render()},1000);

document.addEventListener('DOMContentLoaded', async ()=>{
  render();
  try{
    CLOUD_READY=await window.__loadSupabase();
    if(CLOUD_READY&&window.supabase){
      supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
      const {data,error}=await supabase.auth.getSession();
      if(error)throw error;
      if(data.session?.user){
        await loadAccount(data.session.user);
      }else{
        G='signin';
        DB_STATUS='Cloud ready — sign in';
        render();
      }
    }else{
      G='signin';
      DB_STATUS='Offline mode — cloud unavailable';
      render();
    }
  }catch(e){
    G='signin';
    DB_STATUS='Database unavailable';
    render();
    console.error('Cloud init failed',e);
  }
});
